[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "databases-model-two-ways"
version = "0.1.0"
description = "An equipment-rental shop modeled as tables and as documents; the PostgreSQL version refuses a double booking with an exclusion constraint."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sumit Srivastava" }]
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pip-audit>=2.7",
]

[project.scripts]
rental-shop-book = "rental_shop.interfaces.book_cli:main"
rental-shop-race = "rental_shop.interfaces.race_cli:main"
rental-shop-report = "rental_shop.interfaces.report_cli:main"
rental-shop-health = "rental_shop.interfaces.health_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT", "D100", "D101", "D103", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# Test functions are named for the behavior they check; annotating every one adds noise, not safety.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL from docker-compose.yml (make up)",
    "e2e: runs the lesson's scenario through the command-line programs against PostgreSQL",
]

[tool.coverage.run]
source = ["rental_shop"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "rental_shop"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces -> infrastructure -> application -> domain, never upward"
type = "layers"
layers = [
    "rental_shop.interfaces",
    "rental_shop.infrastructure",
    "rental_shop.application",
    "rental_shop.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application know nothing about PostgreSQL"
type = "forbidden"
source_modules = ["rental_shop.domain", "rental_shop.application"]
forbidden_modules = ["psycopg"]
