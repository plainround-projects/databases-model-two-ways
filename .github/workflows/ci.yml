name: ci

on: [push, pull_request]

jobs:
  check:
    name: Format, lint, types, import rules, unit tests with coverage, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
      - run: make audit

  integration:
    name: Integration and end-to-end tests (PostgreSQL 18 service container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports:
          - 5441:5432
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: rentals
        options: >-
          --health-cmd "pg_isready -U shop -d rentals"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_PASSWORD: ci-only-throwaway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test-integration test-e2e
